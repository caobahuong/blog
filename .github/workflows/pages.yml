name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chặn nếu còn dữ liệu nội bộ
        run: |
          if grep -rnE "easyposbackoffice|bao_cao_tang_truong" data personal_blog.html; then
            echo "Phát hiện thông tin nội bộ, dừng deploy."
            exit 1
          fi

      - name: Chuẩn bị thư mục site
        run: |
          mkdir _site
          cp personal_blog.html _site/index.html
          cp -r data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
